<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4efe4"><meta name="description" content="A peaceful living cow farm. Care for your herd, grow clover, and enjoy the meadow."><title>Clover · A little cow farm</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="#" aria-label="Clover home">✿ <span>Clover</span></a><nav aria-label="Farm toolbar"><button class="nav" id="home">⌂ <span>Farm</span></button><button class="nav" data-panel="pasture">♧ <span>Herd</span></button><button class="nav" data-panel="shop">▱ <span>Farm shop</span></button><button class="nav" data-panel="arrange" aria-label="Edit farm layout">✎ <span>Edit</span></button><button id="help" class="nav">▤ <span>User guide</span></button></nav><div class="toolbar-end"><button id="ambience" class="nav" aria-pressed="false">♪ <span>Sound off</span></button><button id="credits" class="nav">Credits</button></div></header>
<main><section class="world" aria-label="Clover Meadow"><div class="clock-panel"><div class="clock-dial"><span class="dial-morning">Morning</span><span class="dial-noon">Noon</span><span class="dial-night">Night</span><div class="dial-inner"></div><div class="clock-hand" id="clock-hand"></div><i class="clock-pin"></i></div><div class="time-line"><b id="clock">8:00 AM</b><span id="period"> · Morning</span></div><button id="weather" title="Change weather">☀ Sunny</button><div class="resources"><span title="Coins">◉ <b id="coins">240</b></span><span title="Milk bottles">♙ <b id="milk-count">0</b></span><span title="Hay bundles">♧ <b id="hay-count">12</b></span></div><small id="day">DAY 1 · SPRING</small></div>
<div id="edit-banner" hidden><b>EDIT MODE</b><span>Your changes are a draft</span><button id="quick-save-edit">Save layout</button><button id="quick-cancel-edit">Cancel</button></div><div class="canvas-wrap"><canvas id="farm" width="700" height="470" aria-label="Interactive isometric cow farm. Choose a tool, then click a cow or garden plot. Open Herd for keyboard controls."></canvas><div id="float" role="status"></div></div>
<div class="view-controls"><button id="zoomout" aria-label="Zoom out">−<kbd>Z</kbd></button><button id="zoomin" aria-label="Zoom in">+<kbd>X</kbd></button><button id="night" aria-label="Toggle day and night">☾<kbd>N</kbd></button><button id="pause-motion" aria-label="Pause ambient animation" aria-pressed="false">Ⅱ<kbd>P</kbd></button></div>
<div class="toolbelt"><div id="editor-dock" hidden></div><div class="tools" aria-label="Farm tools"><button data-tool="pet" class="selected"><span>♡</span>Pet<kbd>1</kbd></button><button data-tool="feed"><span>♧</span>Feed<kbd>2</kbd></button><button data-tool="milk"><span>♙</span>Milk<kbd>3</kbd></button><button data-tool="grow"><span>⚘</span>Grow<kbd>4</kbd></button><button data-tool="move"><span>↔</span>Move<kbd>5</kbd></button><button id="open-editor"><span>✎</span>Design farm</button></div><div id="garden-controls" hidden aria-label="Clover garden plots"></div><p id="hint">Choose a tool, then click a cow. Take your time.</p></div></section><aside id="side" hidden aria-label="Farm panel"></aside></main>
<footer><span><i></i><span id="game-status" role="status" aria-live="polite">Welcome to Clover Meadow.</span></span><span id="save-status">Your farm saves automatically</span></footer><section id="modal" class="game-screen" hidden aria-label="Game screen"><div id="modal-body"></div></section><script src="game.js"></script></body></html>
